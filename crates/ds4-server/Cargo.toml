[package]
name = "ds4-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "HTTP wire surfaces (Phase 7)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ds4-server-rs"
path = "src/bin/ds4-server-rs.rs"
required-features = ["native"]

[features]
default = []
native = ["dep:ds4-core"]

[dependencies]
ds4-core = { path = "../ds4-core", optional = true }
