<text class="note" x="78" y="478">Points at 2k-8k are single-run volatile on this instrument; points at 10k+ repeat within 1% run to run. The low-end multiplier is therefore the 2k-32k geometric-mean ratio, not a single point; the deep multiplier is the single 128k point. Claims live at depth.</text>
<text class="note" x="78" y="494">Gen lines are token_ids-exact benchy wall tok/s on the continuous+capture path, single stream. v0.3 disarmed speculative decode past 64k (static depth gate); v0.4 keeps it armed at every depth with the quench controller governing — the 64k+ gen gap is that flip plus the flash-decode rewrites.</text>
<text class="note" x="78" y="510">Engine-truth v0.4 deep-decode stamps (turn-2, 512 tok): 55.8 ms/tok @240K (tok/step 2.57), 62.1 @515K (2.75); v0.3: 76.3 / 95.2. GB10 = DGX Spark, sm_121, self-load boots. 2026-07-21.</text>
